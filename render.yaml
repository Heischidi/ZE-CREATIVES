services:
  - type: web
    name: ze-creatives-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      # Secrets / per-deployment values: set these in the Render dashboard.
      - key: DATABASE_URL # Neon pooled connection string
        sync: false
      - key: SECRET_KEY # 64+ random characters
        sync: false
      - key: FRONTEND_URL # e.g. https://your-app.vercel.app (no trailing slash)
        sync: false
      - key: EXTRA_ALLOWED_ORIGINS # optional, comma-separated
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false

